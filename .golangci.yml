version: "2"
run:
  modules-download-mode: readonly
linters:
  default: none
  enable:
    - bodyclose
    - godot
    - gomoddirectives
    - gomodguard_v2
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
  settings:
    gosec:
      excludes:
        - G104
        - G115
        - G304
        - G401
        - G404
        - G501
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gosec
          - ineffassign
        path: _test\.go
      - linters:
          - staticcheck
        text: 'SA4006:'
    paths:
      - raft
      - vfs
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - raft
      - third_party$
      - builtin$
      - examples$
